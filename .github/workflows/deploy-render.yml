name: Deploy to Render

# Every push to ANY branch makes the hosted app run that branch (the last push wins).
# Needs two repository secrets, see DEPLOY.md. Without them this job only prints a notice.
on:
  push:
    branches: ["**"]

concurrency:
  group: render-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Point the Render service at this branch and deploy it
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "::notice::RENDER_API_KEY / RENDER_SERVICE_ID are not set, so nothing was deployed. See DEPLOY.md."
            exit 0
          fi
          api="https://api.render.com/v1/services/$RENDER_SERVICE_ID"
          curl -fsS -X PATCH "$api" -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" \
            -d "$(jq -cn --arg b "$BRANCH" '{branch: $b}')" > /dev/null
          curl -fsS -X POST "$api/deploys" -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}' | jq '{id, status, commit: .commit.id}'
          echo "Deploying branch $BRANCH at $GITHUB_SHA"
