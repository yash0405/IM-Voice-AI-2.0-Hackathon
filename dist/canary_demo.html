<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canary - prove a prompt change before it ships</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 28 28%27%3E%3Crect width=%2728%27 height=%2728%27 rx=%278%27 fill=%27%230b0b0b%27/%3E%3Cpath d=%27M7 15.5l4.2 4.2L21 9%27 stroke=%27white%27 stroke-width=%272.6%27 fill=%27none%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
<style>:root {
  color-scheme: light;
  --bg: #f4f3ef; --surface: #fcfcfb; --surface-2: #f6f5f1;
  --ink: #0b0b0b; --ink-2: #52514e; --ink-3: #6f6d68; --grid: #e1e0d9; --axis: #c3c2b7;
  --border: rgba(11,11,11,.10); --shadow: 0 1px 2px rgba(11,11,11,.04), 0 8px 24px rgba(11,11,11,.04);
  --a: #2a78d6; --b: #eb6834;
  --good: #0ca30c; --good-ink: #006300; --warn: #fab219; --warn-ink: #8a5a00; --bad: #d03b3b; --bad-ink: #a52626;
  --accent: #184f95; --accent-soft: #e4eefb;
  --good-wash: rgba(12,163,12,.09); --bad-wash: rgba(208,59,59,.09); --warn-wash: rgba(250,178,25,.18);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --bg: #0d0d0d; --surface: #1a1a19; --surface-2: #222220;
    --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #a5a39b; --grid: #2c2c2a; --axis: #383835;
    --border: rgba(255,255,255,.10); --shadow: none;
    --a: #3987e5; --b: #d95926;
    --good-ink: #0ca30c; --warn-ink: #fab219; --bad-ink: #ec6a6a;
    --accent: #86b6ef; --accent-soft: #14233a;
    --good-wash: rgba(12,163,12,.14); --bad-wash: rgba(208,59,59,.16); --warn-wash: rgba(250,178,25,.14);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d0d0d; --surface: #1a1a19; --surface-2: #222220;
  --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #a5a39b; --grid: #2c2c2a; --axis: #383835;
  --border: rgba(255,255,255,.10); --shadow: none;
  --a: #3987e5; --b: #d95926;
  --good-ink: #0ca30c; --warn-ink: #fab219; --bad-ink: #ec6a6a;
  --accent: #86b6ef; --accent-soft: #14233a;
  --good-wash: rgba(12,163,12,.14); --bad-wash: rgba(208,59,59,.16); --warn-wash: rgba(250,178,25,.14);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3, h4, p { margin: 0; }
.mono { font-family: var(--mono); font-size: .92em; }
.muted { color: var(--ink-3); }
.sr { position: absolute; left: -9999px; }

/* top bar */
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 24px; padding: 10px 24px;
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 10px; }
.brand b { font-size: 18px; letter-spacing: -.01em; }
.brand span { color: var(--ink-3); font-size: 13px; }
.tabs { display: flex; gap: 4px; margin-left: 12px; }
.tab { border: 0; background: transparent; padding: 7px 14px; border-radius: 8px; color: var(--ink-2); font-weight: 500; }
.tab:hover { background: var(--surface-2); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.iconbtn { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 6px 10px; }

main { max-width: 1480px; margin: 0 auto; padding: 20px 24px 64px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
  background: var(--surface-2); border: 1px solid var(--border); color: var(--ink-2); white-space: nowrap; }
.chip.good { background: var(--good-wash); color: var(--good-ink); border-color: transparent; }
.chip.bad { background: var(--bad-wash); color: var(--bad-ink); border-color: transparent; }
.chip.warn { background: var(--warn-wash); color: var(--warn-ink); border-color: transparent; }
.chip.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); padding: 18px 20px; }
.card h3 { font-size: 15px; font-weight: 650; }
.card .sub { color: var(--ink-3); font-size: 12.5px; margin-top: 2px; }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 8px; }

/* scenario chips */
.scn { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.scn button { display: flex; gap: 10px; align-items: center; text-align: left; padding: 10px 14px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow); min-width: 210px; transition: transform .12s, border-color .12s; }
.scn button:hover { transform: translateY(-1px); border-color: var(--ink-3); }
.scn button[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink), var(--shadow); }
.scn .ic { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; flex: none; }
.scn .t { font-weight: 650; font-size: 13.5px; line-height: 1.2; }
.scn .s { font-size: 12px; color: var(--ink-3); }
.ic.good { background: var(--good-wash); color: var(--good-ink); } .ic.bad { background: var(--bad-wash); color: var(--bad-ink); }
.ic.warn { background: var(--warn-wash); color: var(--warn-ink); } .ic.neutral { background: var(--surface-2); color: var(--ink-2); }

.story { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; color: var(--ink-2); }
.story b { color: var(--ink); }

.grid { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 16px; align-items: start; }
.grid.plan { grid-template-columns: 360px minmax(0, 1fr); }
.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.card, .tile, .stack > * { min-width: 0; }
.card { overflow-wrap: anywhere; }
.card:has(table) { overflow-x: auto; }
.stack { display: grid; gap: 16px; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 1180px) { .grid, .grid.plan { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 900px) { .three { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 760px) { .two { grid-template-columns: minmax(0, 1fr); } .story .chip { white-space: normal; } .tiles[style] { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; } .scn button { min-width: 0; width: 100%; } main { padding: 14px 12px 48px; } .top { padding: 8px 12px; gap: 10px; flex-wrap: wrap; } .brand span { display: none; } }

/* hero */
.hero { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 999px; font-weight: 700; font-size: 12.5px; letter-spacing: .04em; text-transform: uppercase; }
.pill.run { background: var(--accent-soft); color: var(--accent); } .pill.good { background: var(--good-wash); color: var(--good-ink); }
.pill.bad { background: var(--bad-wash); color: var(--bad-ink); } .pill.warn { background: var(--warn-wash); color: var(--warn-ink); }
.pill.neutral { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--border); }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.verdict { font-size: 28px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; margin: 10px 0 6px; }
.reason { color: var(--ink-2); max-width: 70ch; }
.figure { text-align: right; }
.figure .num { font-size: 56px; font-weight: 700; letter-spacing: -.03em; line-height: 1; }
.figure .lbl { color: var(--ink-3); font-size: 12.5px; margin-top: 6px; }
@media (max-width: 760px) { .hero { grid-template-columns: 1fr; } .figure { text-align: left; } .verdict { font-size: 22px; } .figure .num { font-size: 44px; } }

.tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-top: 16px; }
@media (max-width: 900px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
.tile { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.tile .k { font-size: 12px; color: var(--ink-3); }
.tile .v { font-size: 20px; font-weight: 650; letter-spacing: -.01em; margin-top: 2px; }
.tile .d { font-size: 12px; color: var(--ink-3); margin-top: 1px; }
.bar { height: 4px; border-radius: 2px; background: var(--grid); margin-top: 8px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ink); border-radius: 2px; }

.player { display: flex; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.player .btn { border: 1px solid var(--border); background: var(--surface); border-radius: 9px; padding: 6px 12px; font-weight: 600; min-width: 40px; }
.player .btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.player input[type=range] { flex: 1; min-width: 140px; accent-color: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 10px; font-size: 12.5px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* charts */
svg.chart { width: 100%; display: block; overflow: visible; }
.chart text { font: 11px system-ui, sans-serif; fill: var(--ink-3); }
.chart .lbl { fill: var(--ink-2); font-size: 11.5px; }
.chart .grid line { stroke: var(--grid); stroke-width: 1; }
.chart .axis line, .chart .axis path { stroke: var(--axis); stroke-width: 1; fill: none; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 6px 0 2px; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 16px; height: 0; border-top: 2px solid; border-radius: 1px; }
.legend i.sw { width: 10px; height: 10px; border: 0; border-radius: 3px; }
.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 10px; padding: 8px 11px;
  font-size: 12px; line-height: 1.5; max-width: 280px; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.tip b { font-weight: 650; }
.tip .r { display: flex; justify-content: space-between; gap: 18px; }

/* setup */
.var { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-top: 8px; }
.var .row { display: flex; align-items: center; gap: 8px; }
.dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.diff { font-family: var(--mono); font-size: 11.5px; background: var(--surface-2); border-radius: 8px; padding: 8px 10px; margin-top: 8px; overflow-x: auto; white-space: pre-wrap; }
.diff .add { color: var(--good-ink); } .diff .del { color: var(--bad-ink); } .diff .hdr { color: var(--ink-3); }
.rules { display: grid; gap: 7px; margin-top: 10px; font-size: 13px; }
.rules div { display: grid; grid-template-columns: 112px 1fr; gap: 8px; }
.rules dt, .rules .k { color: var(--ink-3); }
.linkbtn { border: 0; background: none; color: var(--accent); padding: 0; font-weight: 600; font-size: 12.5px; }

/* ledger */
.ledger { margin-top: 10px; max-height: 420px; overflow: auto; border-top: 1px solid var(--border); }
.entry { display: grid; grid-template-columns: 34px 1fr; gap: 8px; padding: 9px 2px; border-bottom: 1px solid var(--grid); font-size: 12.5px; }
.entry .seq { color: var(--ink-3); font-family: var(--mono); }
.entry .hd { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.entry .hash { font-family: var(--mono); color: var(--ink-3); font-size: 11px; }
.entry.bad { background: var(--bad-wash); }
.entry.focus { background: var(--accent-soft); }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn2 { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 5px 10px; font-size: 12.5px; font-weight: 600; }
.btn2:hover { border-color: var(--ink-3); }
.verify { margin-top: 8px; font-weight: 600; }

/* proof lab */
.proof-hero { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 1000px) { .proof-hero { grid-template-columns: minmax(0, 1fr); } }
.big { display: flex; align-items: baseline; gap: 14px; margin-top: 10px; flex-wrap: wrap; }
.big .n { font-size: 48px; font-weight: 700; letter-spacing: -.03em; line-height: 1; }
.big .vs { color: var(--ink-3); font-size: 13px; }
.mx { display: grid; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 1100px) { .mx { grid-template-columns: minmax(0, 1fr); } }
table.t { border-collapse: collapse; width: 100%; font-size: 12.5px; }
table.t th { text-align: left; color: var(--ink-3); font-weight: 600; padding: 5px 8px 5px 0; border-bottom: 1px solid var(--border); white-space: nowrap; }
table.t td { padding: 6px 8px 6px 0; border-bottom: 1px solid var(--grid); vertical-align: middle; font-variant-numeric: tabular-nums; }
table.t tr.ours td { font-weight: 650; }
table.t td.num, table.t th.num { text-align: right; padding-right: 12px; }
.pbar { position: relative; height: 10px; background: var(--grid); border-radius: 5px; min-width: 90px; }
.pbar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; }
.pbar i.good { background: var(--good); } .pbar i.bad { background: var(--bad); } .pbar i.neutral { background: var(--ink-3); }
.sec { margin-top: 22px; }
.sec > h2 { font-size: 18px; letter-spacing: -.01em; margin-bottom: 4px; }
.sec > p { color: var(--ink-2); margin-bottom: 12px; max-width: 90ch; }
.heat td.cell { text-align: center; border-radius: 6px; padding: 8px 4px; }
.note { background: var(--warn-wash); border-radius: 10px; padding: 10px 12px; color: var(--ink); font-size: 13px; }
.note.info { background: var(--accent-soft); }
code, .code { font-family: var(--mono); font-size: .9em; background: var(--surface-2); padding: 1px 6px; border-radius: 5px; }

/* planner & labels */
.form { display: grid; gap: 14px; }
.field label { display: flex; justify-content: space-between; font-weight: 600; font-size: 13px; margin-bottom: 4px; }
.field .hint { font-weight: 400; color: var(--ink-3); font-size: 12px; }
.field input[type=number], .field select, .field input[type=text] { width: 100%; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); font: inherit; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pills button { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 5px 11px; font-weight: 600; font-size: 13px; }
.pills button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.verdictbox { border-radius: 12px; padding: 14px 16px; }
.verdictbox.good { background: var(--good-wash); } .verdictbox.bad { background: var(--bad-wash); } .verdictbox.warn { background: var(--warn-wash); }
.lab { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; }
@media (max-width: 1000px) { .lab { grid-template-columns: minmax(0, 1fr); } }
.lbtns { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 12px; }
.lbtns button { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 12px; text-align: left; font-weight: 650; }
.lbtns button small { display: block; font-weight: 400; color: var(--ink-3); }
.lbtns button:hover { border-color: var(--ink); }
.kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--border); border-radius: 5px; padding: 0 5px; color: var(--ink-3); }
audio { width: 100%; margin-top: 8px; }
.conf td, .conf th { text-align: center; padding: 5px 8px; font-size: 12px; }
.conf td { border: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } .scn button { transition: none; } }
@media print { .top, .player, .scn { display: none; } }

/* ---------------------------------------------------------------- simple front door */
.s-wrap { max-width: 980px; margin: 0 auto; padding-top: 8px; }
.s-h1 { font-size: 38px; line-height: 1.1; letter-spacing: -.03em; margin: 18px 0 10px; }
.s-lead { font-size: 18px; color: var(--ink-2); max-width: 62ch; margin: 0 0 24px; line-height: 1.5; }
.s-lead b { color: var(--ink); }
.s-foot { color: var(--ink-3); margin-top: 24px; font-size: 14px; }
.s-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.s-card { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left; padding: 22px; border-radius: 20px;
  background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); transition: transform .14s, box-shadow .14s, border-color .14s; }
.s-card:hover, .s-card:focus-visible { transform: translateY(-3px); border-color: var(--ink-3); box-shadow: 0 12px 32px rgba(0,0,0,.10); outline: none; }
.s-ic { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; margin-bottom: 8px; }
.s-ic.good { background: var(--good-wash); color: var(--good-ink); } .s-ic.bad { background: var(--bad-wash); color: var(--bad-ink); }
.s-ic.warn { background: var(--warn-wash); color: var(--warn-ink); } .s-ic.neutral { background: var(--surface-2); color: var(--ink-2); }
.s-ct { font-size: 19px; font-weight: 700; letter-spacing: -.01em; line-height: 1.25; }
.s-cb { color: var(--ink-3); font-size: 15px; }
.s-go { margin-top: 10px; color: var(--accent); font-weight: 650; display: inline-flex; align-items: center; gap: 6px; }
.s-back { border: 0; background: none; color: var(--ink-3); font-weight: 600; padding: 4px 0; display: inline-flex; align-items: center; gap: 6px; }
.s-back:hover { color: var(--ink); }
.s-two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
.s-tile { border-radius: 20px; padding: 22px 24px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); }
.s-tile.b { border-color: color-mix(in srgb, var(--b) 45%, var(--border)); }
.s-k { display: flex; align-items: center; gap: 8px; font-weight: 650; color: var(--ink-2); font-size: 16px; }
.s-big { font-size: 60px; font-weight: 750; letter-spacing: -.04em; line-height: 1.05; margin: 8px 0 4px; }
.s-sm { color: var(--ink-3); font-size: 14px; }
.s-panel { border-radius: 20px; padding: 24px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); }
.s-h2 { font-size: 20px; margin: 0 0 4px; letter-spacing: -.01em; }
.s-status { font-size: 18px; font-weight: 600; margin: 4px 0 14px; min-height: 26px; }
.s-prog { display: flex; align-items: center; gap: 14px; }
.s-progbar { flex: 1; height: 8px; border-radius: 4px; background: var(--grid); overflow: hidden; }
.s-progbar i { display: block; height: 100%; width: 0; background: var(--ink); border-radius: 4px; transition: width .12s linear; }
.s-result { display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: start; border-radius: 20px; padding: 26px 28px; margin-top: 16px; }
.s-result.good { background: var(--good-wash); } .s-result.bad { background: var(--bad-wash); }
.s-result.warn { background: var(--warn-wash); } .s-result.neutral { background: var(--surface-2); border: 1px solid var(--border); }
.s-result:not(:has(.s-ric)) { grid-template-columns: 1fr; }
.s-ric { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); }
.s-result.good .s-ric { color: var(--good-ink); } .s-result.bad .s-ric { color: var(--bad-ink); } .s-result.warn .s-ric { color: var(--warn-ink); }
.s-rt { font-size: 26px; font-weight: 750; letter-spacing: -.02em; line-height: 1.2; }
.s-rd { font-size: 17px; color: var(--ink); margin: 8px 0 12px; max-width: 64ch; line-height: 1.5; }
.s-facts { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.s-facts span { background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 14px; color: var(--ink-2); }
.s-facts b { color: var(--ink); }
.s-next { margin: 0; color: var(--ink-2); font-size: 15px; }
.s-usual { border: 1px dashed var(--axis); border-radius: 16px; padding: 16px 20px; margin-top: 14px; }
.s-usual p { margin: 4px 0 0; color: var(--ink-2); font-size: 15.5px; line-height: 1.5; }
.s-ut { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); }
.s-actions { display: flex; align-items: center; gap: 18px; margin-top: 18px; }

  fix_flat:       { title: "The fix does almost nothing", blurb: "Too small to prove, so nothing changes.", tone: "neutral", ic: "approx" },
  b_wins:         { title: "The new prompt is better", blurb: "More buyers give their requirement.", tone: "good", ic: "check" },
  b_harmful:      { title: "The new prompt is worse", blurb: "Fewer buyers give their requirement.", tone: "bad", ic: "x" },
  inconclusive:   { title: "The change is too small to tell", blurb: "Hardly any real difference.", tone: "neutral", ic: "approx" },
  peeking_trap:   { title: "It only looks like a winner", blurb: "A lucky streak that is not real.", tone: "warn", ic: "alert" },
  srm_broken:     { title: "Something went wrong in the test", blurb: "The numbers cannot be trusted.", tone: "warn", ic: "link" },
  guardrail_veto: { title: "More leads, but calls run too long", blurb: "A win with a catch.", tone: "bad", ic: "clock" }
};

const stopV = () => { V.playing = false; clearInterval(V.timer); V.timer = null; };
const goalName = k => { const d = (D.dispositions || []).find(x => x.key === k); return d ? d.name : k.replace(/_/g, " "); };
const rate1 = x => (x * 100).toFixed(1) + "%";

/* ------------------------------------------------------------------ the fix journey (front door) */
const cards = list => list.map(s => { const p = PICK[s.meta.key] || { title: s.meta.title, blurb: "", tone: "neutral", ic: "approx" };
  return `<button class="s-card" data-key="${s.meta.key}"><span class="s-ic ${p.tone}">${icon(p.ic, 26)}</span><span class="s-ct">${esc(p.title)}</span><span class="s-cb">${esc(p.blurb)}</span><span class="s-go">Watch it ${icon("fwd", 14)}</span></button>`; }).join("");
const wire = () => $$(".s-card").forEach(b => b.onclick = () => startRun(b.dataset.key));
const pc0 = x => Math.round(x * 100) + "%";

function fixStep(n, title, body) { return `<section class="fx-step"><div class="fx-n">${n}</div><div class="fx-b"><h2 class="fx-t">${title}</h2>${body}</div></section>`; }

function fixFind(F) {
  const m = F.mine, I = k => m.issues.find(r => r.key === k) || {};
  const rows = m.issues.filter(r => r.eligible).sort((a, b) => b.calls - a.calls).slice(0, 3);
  const maxp = Math.max(...rows.map(r => r.pct_of_connected));
  const verdict = r => r.key === m.target ? ["bad", "Costs the most leads"]
    : r.gap_pp < -5 ? ["neutral", "Common, but these calls do better"] : ["neutral", "No clear effect on leads"];
  const pm = I(m.pm_pick), tg = I(m.target);
  return fixStep(1, "Find what is really losing leads", `
    <p class="s-lead" style="margin-bottom:14px">We had Sarvam listen to <b>${nf(m.n_calls)} real VANI calls</b> and note what went wrong. About <b>${rate1(m.baseline.rate)}</b> of calls end with a usable requirement (quantity and specification), somewhere between ${pc0(m.baseline.ci[0])} and ${pc0(m.baseline.ci[1])}. So where do the other leads go?</p>
    <div class="fx-rows">${rows.map(r => { const v = verdict(r); return `<div class="fx-row ${r.key === m.target ? "hit" : ""}">
      <div class="fx-name"><b>${esc(r.name)}</b><span>${esc(r.meaning)}</span></div>
      <div class="fx-bar" title="${nf(r.calls)} of ${nf(m.n_connected)} answered calls"><i style="width:${(r.pct_of_connected / maxp * 100).toFixed(0)}%"></i><em>${pc0(r.pct_of_connected)} of calls</em></div>
      <div class="fx-conv"><span><b>${pc0(r.converted_with)}</b> become BuyLeads with this</span><span><b>${pc0(r.converted_without)}</b> without it</span></div>
      <span class="chip ${v[0] === "bad" ? "bad" : ""}">${v[1]}</span></div>`; }).join("")}</div>
    <div class="s-usual"><div class="s-ut">Why we do not just fix the most common problem</div>
      <p>A tool that counts failures would pick <b>&ldquo;${esc(pm.name || "")}&rdquo;</b>, the biggest group among calls that did not convert (${nf(pm.failed_calls || 0)} calls). But calls with it convert <b>better</b>, ${pc0(pm.converted_with || 0)} against ${pc0(pm.converted_without || 0)}, so fixing it would recover nothing. Canary compares the calls that convert with the ones that do not, and picks <b>&ldquo;${esc(tg.name || "")}&rdquo;</b>: ${pc0(tg.converted_with || 0)} against ${pc0(tg.converted_without || 0)}. Removing it completely could add up to about <b>${tg.ceiling_pp} more BuyLeads per 100 calls</b>.</p></div>
    <p class="s-sm" style="margin-top:10px">These tags are written by Sarvam's AI and have not all been checked by a person yet. They show where to look. The live test in step 4 is what proves cause.</p>`);
}

function fixDraft(F) {
  const P = F.proposal;
  if (!P) return fixStep(2, "Let Sarvam draft the fix", `<div class="s-honest">No fix has been drafted yet. Run <code>python -m canary fix propose --yes</code> (about Rs 0.05).</div>`);
  const line = l => { const c = l[0] === "+" ? "add" : l[0] === "-" ? "del" : "ctx"; return `<div class="fx-l ${c}"><i>${c === "add" ? "+" : c === "del" ? "&minus;" : ""}</i><span>${esc(l.slice(1).replace(/^\s?/, ""))}</span></div>`; };
  const body = (P.diff || []).filter(l => !/^(---|\+\+\+|@@)/.test(l));
  return fixStep(2, "Sarvam drafts one small fix", `
    <p class="s-lead" style="margin-bottom:14px">Sarvam's language model read the ${nf(P.evidence.calls_with_issue)} calls with this problem, the measured pattern, and VANI's current instructions. It drafted <b>one line</b>:</p>
    <div class="fx-diff" role="group" aria-label="The change to VANI's instructions">${body.map(line).join("")}</div>
    <div class="fx-meta"><div><span class="s-ut">What it is meant to do</span><p>${esc(P.why)}</p></div><div><span class="s-ut">The risk Sarvam flagged</span><p>${esc(P.risk)}</p></div></div>
    <p class="s-sm">Drafted by ${esc(P.model)}. It costs about Rs 0.05 and goes into the test record with the evidence behind it. A person can edit or reject it before the test starts.</p>`);
}

function fixPrecheck(F) {
  const S = F.prescreen;
  if (!S) return fixStep(3, "Pre-check it on simulated buyers", `<div class="s-honest">Not run yet. Run <code>python -m canary fix prescreen --yes</code> (about Rs 10).</div>`);
  const ok = S.passed, A = S.A, B = S.B, n = S.n_pairs;
  const chk = (good, txt) => `<li class="${good ? "ok" : "no"}">${icon(good ? "check" : "x", 16)}<span>${txt}</span></li>`;
  return fixStep(3, "Pre-check it on simulated buyers", `
    <p class="s-lead" style="margin-bottom:14px">Before any real buyer hears it, ${n} simulated buyers (different moods, products and languages, played by Sarvam's model) talk to VANI twice: once with today's prompt, once with the fix. Sarvam's tagger scores every call.</p>
    <div class="s-two">
      <div class="s-tile a"><div class="s-k"><span class="dot" style="background:var(--a)"></span>Today's prompt</div><div class="s-big">${A.converted}<small> of ${n}</small></div><div class="s-sm">simulated buyers gave a usable requirement</div></div>
      <div class="s-tile b"><div class="s-k"><span class="dot" style="background:var(--b)"></span>With the fix</div><div class="s-big">${B.converted}<small> of ${n}</small></div><div class="s-sm">simulated buyers gave a usable requirement</div></div>
    </div>
    <ul class="fx-checks">
      ${chk(S.checks.conversion, `Usable requirements are not lower (${A.converted} vs ${B.converted})`)}
      ${chk(S.checks.fatal, `No more failed calls (${A.fatal} vs ${B.fatal})`)}
      ${chk(S.checks.turns, `Calls are not longer (${A.bot_turns} vs ${B.bot_turns} bot turns on average)`)}
    </ul>
    <p class="s-sm" style="margin:0 0 10px">Abrupt endings seen: <b>${A.target_issue}</b> with today's prompt, <b>${B.target_issue}</b> with the fix (${n} calls each).${A.target_issue === 0 && B.target_issue === 0 ? " The simulated VANI never ended a call abruptly under either prompt, and the two prompts converted almost the same number of buyers, so this step cannot tell them apart. It checks the fix does no harm; it does not show a gain." : ""}</p>
    <p><span class="chip ${ok ? "good" : "bad"}">${ok ? "Passed: no sign of harm, so it goes to a live test" : "Held back: it looks worse, so it does not reach real buyers"}</span> <button class="s-link" id="hearlink">Listen to the calls</button></p>
    <p class="s-sm">Be clear: ${n} simulated buyers cannot prove an improvement. This step only keeps a clearly worse edit away from real buyers. The pass rule was fixed in the code before the run.</p>`);
}

function fixProve(F) {
  const P = F.plan, fx = D.scenarios.filter(s => s.meta.key.startsWith("fix_")), rest = D.scenarios.filter(s => !s.meta.key.startsWith("fix_"));
  return fixStep(4, "Prove it on live traffic, then roll it out", `
    ${P ? `<p class="s-lead" style="margin-bottom:14px">To be sure of a lift of ${(P.mde * 100).toFixed(0)} points (${rate1(P.baseline)} to ${rate1(P.baseline + P.mde)}), Canary needs about <b>${nf(P.n_max)} calls</b>. At ${nf(P.leads_per_day)} calls a day with half of them on the fix, that is about <b>${Math.ceil(P.days_needed)} days</b>. Canary checks after every batch and acts the moment the evidence is strong, so it can finish sooner.</p>` : ""}
    <p class="s-sm" style="margin:0 0 14px">Pick what the fix really does and watch Canary find out. These are simulations with a known answer, so you can see it get each one right.</p>
    <div class="s-cards">${cards(fx)}</div>
    <details class="s-how"><summary>More situations Canary handles</summary><div class="s-cards" style="margin-top:14px">${cards(rest)}</div></details>`);
}

function renderTry() {
  stopV();
  if (V.key) return renderRun();
  const F = D.fix;
  if (!F || !F.mine || !F.mine.issues.length) {                         // no labels yet: the plain scenario picker
    $("#app").innerHTML = `<div class="s-wrap"><h1 class="s-h1">Test a prompt change safely</h1><p class="s-lead">Canary tries a new prompt on a few buyers and tells you, in plain words, whether to roll it out. Pick a situation to watch it work.</p><div class="s-cards">${cards(D.scenarios)}</div></div>`;
    return wire();
  }
  $("#app").innerHTML = `<div class="s-wrap">
    <h1 class="s-h1">The bot finds its own weak spot, fixes it, and proves the fix</h1>
    <p class="s-lead">Four steps, using VANI's real calls. Nothing reaches a buyer until the evidence says it is safe.</p>
    <div class="fx">${fixFind(F)}${fixDraft(F)}${fixPrecheck(F)}${fixProve(F)}</div>
    <p class="s-foot">Every step, including the evidence behind the fix, is saved in a tamper-proof record. <button class="s-link" id="totrust">Why you can trust the result</button></p></div>`;
  wire();
  const h = $("#hearlink"); if (h) h.onclick = () => go("hear");
  $("#totrust").onclick = () => go("trust");
}

function startRun(key) {
  const sc = D.scenarios.find(s => s.meta.key === key); if (!sc) return;
  V.key = key; V.rec = sc.record; V.meta = sc.meta; V.k = 1;
  renderRun(); playV();
}

/* ------------------------------------------------------------------ the run screen */
function renderRun() {
  const rec = V.rec, c = rec.config, B = rec.variants.B, p = PICK[V.key] || { title: V.meta.title };
  $("#app").innerHTML = `<div class="s-wrap">
    <button class="s-back" id="sb">${icon("back", 14)} Pick another situation</button>
    <h1 class="s-h1">${esc(p.title)}</h1>
    <p class="s-lead">We are trying a new prompt, <b>&ldquo;${esc(B.name)}&rdquo;</b>, on ${pct(c.share_b, 0)} of buyers. Everyone else keeps today's prompt. The goal: more calls that end with a <b>${esc(goalName(c.primary_goal))}</b>, meaning the buyer's requirement is captured and the seller does not lose the lead.</p>
    <div class="s-two">
      <div class="s-tile a"><div class="s-k"><span class="dot" style="background:var(--a)"></span>Today's prompt</div><div class="s-big" id="ra">-</div><div class="s-sm" id="na">-</div></div>
      <div class="s-tile b"><div class="s-k"><span class="dot" style="background:var(--b)"></span>New prompt</div><div class="s-big" id="rb">-</div><div class="s-sm" id="nb">-</div></div>
    </div>
    <div class="s-panel">
      <h2 class="s-h2">Is the new prompt better?</h2>
      <div id="gauge"></div>
      <p class="s-status" id="status"></p>
      <div class="s-prog"><div class="s-progbar"><i id="pbar"></i></div><span id="plabel" class="s-sm"></span></div>
    </div>
    <div id="result"></div>
    <div class="s-actions"><button class="s-btn" id="sp"></button><button class="s-link" id="ss">Skip to the result</button></div>
    <details class="s-how" id="how"><summary>How did Canary decide?</summary><div id="howbody"></div></details>
  </div>`;
  $("#sb").onclick = () => { V.key = null; renderTry(); };
  $("#sp").onclick = () => { if (V.k >= V.rec.looks.length) { V.k = 1; playV(); } else if (V.playing) { stopV(); updateRun(); } else playV(); };
  $("#ss").onclick = () => { stopV(); V.k = V.rec.looks.length; updateRun(); };
  renderHow(); updateRun();
}

function playV() {
  const L = V.rec.looks.length; V.playing = true; clearInterval(V.timer);
  V.timer = setInterval(() => { if (V.k >= L) { stopV(); updateRun(); return; } V.k++; updateRun(); }, 150);
  updateRun();
}

function gauge(row) {
  const narrow = innerWidth < 640, W = narrow ? 540 : 900, F = narrow ? 1.5 : 1, x0 = 30, x1 = W - 30, R = 4, sx = z => x0 + (Math.max(-R, Math.min(R, z)) + R) / (2 * R) * (x1 - x0);
  const eff = row.eff, harm = row.harm, ex = sx(eff), hx = sx(-harm), nx = sx(row.z);
  const green = eff < R ? `<rect x="${ex}" y="62" width="${x1 - ex}" height="30" fill="var(--good)" opacity=".85"/>` : "";
  const red = harm < R ? `<rect x="${x0}" y="62" width="${hx - x0}" height="30" fill="var(--bad)" opacity=".85"/>` : "";
  const midL = (harm < R ? hx : x0), midR = (eff < R ? ex : x1);
  return `<svg viewBox="0 0 ${W} ${narrow ? 170 : 150}" width="100%" role="img" aria-label="Gauge: stop, keep testing, or ship it">
    <rect x="${x0}" y="62" width="${x1 - x0}" height="30" rx="15" fill="var(--grid)"/>
    <clipPath id="gc"><rect x="${x0}" y="62" width="${x1 - x0}" height="30" rx="15"/></clipPath><g clip-path="url(#gc)">${red}${green}</g>
    <text x="${(midL + midR) / 2}" y="82" text-anchor="middle" font-size="${15*F}" font-weight="600" fill="var(--ink-2)">Keep testing</text>
    ${harm < R ? `<text x="${(x0 + hx) / 2}" y="82" text-anchor="middle" font-size="${14*F}" font-weight="700" fill="#fff">${hx - x0 > 70 ? "Stop" : ""}</text>` : ""}
    ${eff < R ? `<text x="${(ex + x1) / 2}" y="82" text-anchor="middle" font-size="${14*F}" font-weight="700" fill="#fff">${x1 - ex > 80 ? "Ship it" : ""}</text>` : ""}
    <path d="M${nx - 11},38 L${nx + 11},38 L${nx},58 Z" fill="var(--ink)"/>
    <text x="${nx}" y="30" text-anchor="middle" font-size="${14*F}" font-weight="700" fill="var(--ink)">Now</text>
    <text x="${x0}" y="${narrow ? 158 : 132}" font-size="${13*F}" fill="var(--ink-3)">Clearly worse</text>
    <text x="${x1}" y="${narrow ? 158 : 132}" font-size="${13*F}" fill="var(--ink-3)" text-anchor="end">Clearly better</text>
    ${eff >= R ? `<text x="${x1}" y="52" font-size="${12*F}" fill="var(--ink-3)" text-anchor="end">Ship-it line is far away for now &rarr;</text>` : ""}
  </svg>`;
}
const seenRows = () => V.rec.looks.slice(0, V.k);

function updateRun() {
  if (!$("#gauge")) return;
  const rec = V.rec, L = rec.looks.length, row = rec.looks[V.k - 1], final = V.k >= L, res = rec.result;
  $("#ra").textContent = rate1(row.rateA); $("#rb").textContent = rate1(row.rateB);
  $("#na").textContent = `${nf(row.xA)} of ${nf(row.nA)} calls became a BuyLead`;
  $("#nb").textContent = `${nf(row.xB)} of ${nf(row.nB)} calls became a BuyLead`;
  $("#gauge").innerHTML = gauge(row);
  const pr = Math.min(1, row.n / rec.design.n_max);
  $("#pbar").style.width = (pr * 100) + "%";
  $("#plabel").textContent = `${nf(row.n)} of ${nf(rec.design.n_max)} planned calls`;
  let st;
  if (final) st = "Canary has made its decision.";
  else if (row.z > 1.2) st = "Leaning towards the new prompt, but not sure yet. Keep collecting calls.";
  else if (row.z < -1.2) st = "Leaning against the new prompt, but not sure yet. Keep collecting calls.";
  else st = "No clear difference yet. Too early to say, so Canary keeps collecting calls.";
  $("#status").textContent = st;
  const sp = $("#sp"); sp.innerHTML = final ? `${icon("play", 14)} Watch again` : (V.playing ? `${icon("pause", 14)} Pause` : `${icon("play", 14)} Continue`);
  $("#ss").hidden = final;
  $("#result").innerHTML = final ? resultCard() : "";
}

function usualTool() {
  const P = D.proof; if (!P) return "";
  const S = P.scenarios, o = (k, m, x) => (S[k].methods[m].outcomes[x] || { rate: 0 }).rate, k = V.key;
  const pc = x => Math.round(x * 100) + "%";
  const naive = V.rec.looks.find(r => r.naive_cross && r.z > 0);
  if (k.startsWith("fix_")) {
    const rec = V.rec, d = rec.design, r = rec.result, planB = Math.round(d.n_max * rec.config.share_b);
    if (k === "fix_ships") return `A test that runs for a fixed length would wait for all <b>${nf(d.n_max)}</b> calls before deciding. Canary was sure after <b>${nf(r.calls_analysed)}</b>, so the fix reached everyone about <b>${Math.round((1 - r.calls_analysed / d.n_max) * 100)}%</b> sooner, without raising the chance of a false win.`;
    if (k === "fix_harms") return `A fixed-length test would have kept about <b>${nf(planB)}</b> buyers on the worse prompt until the end. Canary stopped after <b>${nf(r.exposed_b_calls)}</b>.`;
    return `With an effect this small, a tool that peeks every day would still announce a winner <b>${pc(o("aa", "naive_peek", "PROMOTE"))}</b> of the time even when nothing changed (in our tests). Saying &ldquo;we cannot tell&rdquo; is the honest answer, and the next edit gets its turn.`;
  }
  if (k === "peeking_trap") return `A usual tool that checks the numbers every day would have announced a winner after ${naive ? nf(naive.n) : "about 1,400"} calls and rolled it out. That would have been a mistake: there is no real difference. In our tests, usual tools make this mistake <b>${pc(o("aa", "naive_peek", "PROMOTE"))}</b> of the time. Canary: <b>${pc(o("aa", "canary", "PROMOTE"))}</b>.`;
  if (k === "srm_broken") return `A usual tool would have rolled this out, because the new prompt looked ${((V.rec.looks[V.rec.looks.length - 1].diff) * 100).toFixed(1)} points better. In our tests it does so <b>${pc(o("srm_bug", "naive_peek", "PROMOTE"))}</b> of the time. Canary caught the problem and stopped: it rolls out a broken test only <b>${pc(o("srm_bug", "canary", "PROMOTE"))}</b> of the time.`;
  if (k === "guardrail_veto") return `A tool that only watches BuyLead conversion would have rolled this out (<b>${pc(o("guardrail", "naive_peek", "PROMOTE"))}</b> of the time in our tests). Canary also checks average handling time, so it did not.`;
  if (k === "b_harmful") return `A test that runs for a fixed length keeps sending buyers to a worse prompt until the end: about <b>${nf(S.harm.methods.fixed_horizon.mean_exposure_b)}</b> buyers on average, against <b>${nf(S.harm.methods.canary.mean_exposure_b)}</b> with Canary.`;
  if (k === "b_wins") return `A fixed-length test needs about <b>${nf(S.win.methods.fixed_horizon.median_n_when_promoted)}</b> calls before it can decide. Canary typically decides after <b>${nf(S.win.methods.canary.median_n_when_promoted)}</b>.`;
  if (k === "inconclusive") return `With an effect this small, some tools would still announce a winner (<b>${pc(o("small", "naive_peek", "PROMOTE"))}</b> of the time in our tests). Saying &ldquo;we cannot tell&rdquo; is the honest answer.`;
  return "";
}

function B_origin() {
  const b = V.rec.variants.B;
  if (b.origin !== "ai-mined") return "";
  const f = (D.fix || {}).proposal, e = f ? f.evidence : null;
  return `<p class="s-next" style="margin-bottom:8px"><b>Where the fix came from:</b> Sarvam drafted it from ${e ? nf(e.calls_with_issue) : "the"} real calls with &ldquo;${esc(e ? e.issue_name.toLowerCase() : "this problem")}&rdquo;. That evidence is the first entry in the record.</p>`;
}

function resultCard() {
  const rec = V.rec, res = rec.result, last = rec.looks[rec.looks.length - 1], c = rec.config, g = last.guardrail;
  const pts = ((last.rateB - last.rateA) * 100), exp = res.exposed_b_calls, days = Math.max(1, Math.ceil((new Date(last.time) - new Date(c.start)) / 86400000));
  const T = {
    PROMOTE: ["good", "check", "The new prompt is better. It is now rolled out to everyone.",
      `It turns ${rate1(last.rateB)} of calls into BuyLeads against ${rate1(last.rateA)} today (${pts >= 0 ? "+" : ""}${pts.toFixed(1)} points)${g ? ", and average handling time stayed within the safe limit" : ""}. The evidence was strong enough to be sure it is not luck.`, "All buyers now get the new prompt."],
    STOP_HARM: ["bad", "x", "The new prompt is worse, so Canary stopped it early.",
      `It turned only ${rate1(last.rateB)} of calls into BuyLeads against ${rate1(last.rateA)} today. Only ${nf(exp)} buyers ever heard it.`, "Everyone is back on today's prompt."],
    INCONCLUSIVE: ["neutral", "approx", "No real difference was found, so nothing changes.",
      `After the full test the two prompts look the same (${rate1(last.rateB)} vs ${rate1(last.rateA)}). Canary will not roll out a change it cannot prove.`, "Today's prompt stays."],
    HALT_SRM: ["warn", "link", "The test itself broke, so nothing was rolled out.",
      `The new prompt looked ${pts.toFixed(1)} points better, but calls from one group were going missing from the records, so the numbers cannot be trusted. Fix the tracking, then run the test again.`, "Everyone is on today's prompt."],
    STOP_GUARDRAIL: ["bad", "clock", "More BuyLeads, but calls run too long, so it was stopped.",
      `The new prompt makes more BuyLeads (${rate1(last.rateB)} vs ${rate1(last.rateA)}) but average handling time is ${g ? (g.worse * 100).toFixed(0) : "much"}% longer. The limit is ${(c.guardrail_margin * 100).toFixed(0)}%.`, "Everyone is back on today's prompt."],
    NO_PROMOTE_GUARDRAIL: ["warn", "alert", "More BuyLeads, but not proven safe, so it was not rolled out.", "Handling time could not be shown to stay within the limit.", "Today's prompt stays."]
  }[res.kind] || ["neutral", "approx", res.kind, res.reason, ""];
  const ut = usualTool();
  const lenTxt = g ? `${g.worse >= 0 ? "+" : ""}${(g.worse * 100).toFixed(0)}% (limit +${(c.guardrail_margin * 100).toFixed(0)}%)` : "";
  return `<div class="s-result ${T[0]}"><div class="s-ric">${icon(T[1], 34)}</div><div>
    <div class="s-rt">${esc(T[2])}</div><p class="s-rd">${esc(T[3])}</p>

/* ------------------------------------------------------------------ plan a test */
function renderPlan() {
  stopV();
  const G = D.plans, p = V.plan, cell = (b, m, s) => G.cells.find(c => c.baseline === b && c.mde === m && c.share === s);
  const PK = x => Number.isInteger(x) ? x.toFixed(1) : String(x);
  const fkey = f => { const ok = G.fractions.filter(x => x <= f + 1e-9); return ok.length ? PK(ok[ok.length - 1]) : null; };
  const c = cell(p.b, p.m, p.s);
  if (!c) { $("#app").innerHTML = `<div class="s-wrap"><p class="s-lead">Please pick a smaller improvement: today's rate plus the improvement must stay below 95%.</p></div>`; return; }
  const cap = p.lpd * p.days, f = Math.min(1, cap / c.n_max), fk = fkey(f), power = fk ? c.power_at[fk] : 0, days = Math.ceil(c.n_max / p.lpd);
  let tone, head, body;
  if (f >= 1) { tone = "good"; head = "Yes, this test can give you a clear answer."; body = `You need about ${nf(c.n_max)} calls, which is roughly ${days} day${days > 1 ? "s" : ""} of your traffic. If the new prompt really is ${(p.m * 100).toFixed(0)} points better, there is about a ${Math.round(power * 100)}% chance Canary will spot it.`; }
  else if (power >= 0.65) { tone = "warn"; head = "Maybe. It could work, but it is tight."; body = `You need about ${nf(c.n_max)} calls (${days} days). In ${p.days} days you would have ${Math.round(f * 100)}% of that, so the chance of spotting a real improvement drops to about ${Math.round(power * 100)}%.`; }
  else { tone = "bad"; head = "Not as set. This test would probably end with no answer."; body = `You need about ${nf(c.n_max)} calls (${days} days at your traffic), but ${p.days} days only gives ${Math.round(f * 100)}% of that. The chance of spotting a real improvement would be just ${Math.round(power * 100)}%.`; }
  let tip = "";
  if (f < 1) {
    const alt = G.shares.map(s => cell(p.b, p.m, s)).filter(Boolean).find(cc => { const ff = Math.min(1, cap / cc.n_max), k = fkey(ff); return ff >= 1 || (k && cc.power_at[k] >= 0.8); });
    tip = alt ? `Tip: send ${Math.round(alt.share * 100)}% of buyers to the new prompt and this test fits in ${p.days} days.` : `Tip: run the test for about ${days} days, or try a bigger improvement.`;
  }
  const pills = (arr, key, fmt) => `<span class="s-pills">${arr.map(x => `<button data-k="${key}" data-v="${x}" aria-pressed="${x === p[key]}">${fmt(x)}</button>`).join("")}</span>`;

    <p class="s-lead">Fill in the sentence. Canary tells you before you start whether the test can work.</p>

    <div class="s-result ${tone}" style="margin-top:20px"><div><div class="s-rt">${head}</div><p class="s-rd">${body}</p>${tip ? `<p class="s-next"><b>${esc(tip)}</b></p>` : ""}</div></div>

/* ------------------------------------------------------------------ sha256 (pure JS, works on file://) */
function sha256(str) {
  const K = new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
  const bytes = new TextEncoder().encode(str);
  const l = bytes.length, total = ((l + 9 + 63) >> 6) << 6;
  const buf = new Uint8Array(total); buf.set(bytes); buf[l] = 0x80;
  const dv = new DataView(buf.buffer); dv.setUint32(total - 4, (l * 8) >>> 0); dv.setUint32(total - 8, Math.floor(l / 0x20000000));
  const H = new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]);
  const w = new Uint32Array(64);
  const rr = (x, n) => (x >>> n) | (x << (32 - n));
  for (let o = 0; o < total; o += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i * 4);
    for (let i = 16; i < 64; i++) { const s0 = rr(w[i-15],7) ^ rr(w[i-15],18) ^ (w[i-15] >>> 3), s1 = rr(w[i-2],17) ^ rr(w[i-2],19) ^ (w[i-2] >>> 10); w[i] = (w[i-16] + s0 + w[i-7] + s1) >>> 0; }
    let [a, b, c, d, e, f, g, hh] = H;
    for (let i = 0; i < 64; i++) {
      const S1 = rr(e,6) ^ rr(e,11) ^ rr(e,25), ch = (e & f) ^ (~e & g), t1 = (hh + S1 + ch + K[i] + w[i]) >>> 0;
      const S0 = rr(a,2) ^ rr(a,13) ^ rr(a,22), mj = (a & b) ^ (a & c) ^ (b & c), t2 = (S0 + mj) >>> 0;
      hh = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    H[0] += a; H[1] += b; H[2] += c; H[3] += d; H[4] += e; H[5] += f; H[6] += g; H[7] += hh;
  }
  return [...H].map(x => x.toString(16).padStart(8, "0")).join("");
}

/** Draw a time-series chart. spec: {xd, yd, xt, yt, xf, yf, layers(fn(sx,sy,w,h)->svg string), h, ml, ...}. */
function drawChart(el, spec, rows) {
  const w = Math.max(280, el.clientWidth || 600), h = spec.h || 260;
  const ml = spec.ml ?? 46, mr = spec.mr ?? 16, mt = spec.mt ?? 10, mb = spec.mb ?? 28;
  const [x0, x1] = spec.xd, [y0, y1] = spec.yd;
  const sx = v => ml + (v - x0) / (x1 - x0) * (w - ml - mr);
  const sy = v => mt + (1 - (Math.min(Math.max(v, y0), y1) - y0) / (y1 - y0)) * (h - mt - mb);
  let g = "";
  for (const t of spec.yt) g += `<g class="grid"><line x1="${ml}" x2="${w - mr}" y1="${sy(t)}" y2="${sy(t)}"/></g><text x="${ml - 8}" y="${sy(t) + 4}" text-anchor="end">${spec.yf(t)}</text>`;
  for (const t of spec.xt) g += `<text x="${sx(t)}" y="${h - 8}" text-anchor="middle">${spec.xf(t)}</text><g class="axis"><line x1="${sx(t)}" x2="${sx(t)}" y1="${h - mb}" y2="${h - mb + 4}"/></g>`;
  g += `<g class="axis"><line x1="${ml}" x2="${w - mr}" y1="${h - mb}" y2="${h - mb}"/></g>`;
  g += spec.layers(sx, sy, w, h, { ml, mr, mt, mb });
  g += `<line class="cursor" x1="0" x2="0" y1="${mt}" y2="${h - mb}" stroke="var(--ink)" stroke-width="1" opacity="0" />`;
  g += `<rect class="hit" x="${ml}" y="${mt}" width="${w - ml - mr}" height="${h - mt - mb}" fill="transparent"/>`;
  el.innerHTML = `<svg class="chart" viewBox="0 0 ${w} ${h}" height="${h}" role="img" aria-label="${esc(spec.label || "chart")}">${g}</svg>`;
  el.__sx = sx; el.__rows = rows; el.__tip = spec.tip; el.__xs = rows.map(r => sx(r.n));
  const hit = $(".hit", el);
  hit.addEventListener("mousemove", ev => {
    const b = hit.getBoundingClientRect(), px = ev.clientX - b.left + ml;
    let bi = 0, bd = 1e9; el.__xs.forEach((x, i) => { const d = Math.abs(x - px); if (d < bd) { bd = d; bi = i; } });
    setCursor(bi); showTip(spec.tip(rows[bi], bi), ev);
  });
  hit.addEventListener("mouseleave", () => { setCursor(null); hideTip(); });
}
function setCursor(i) {
  $$(".cv").forEach(el => {
    const c = $(".cursor", el); if (!c || !el.__xs) return;
    if (i == null || !el.__xs[i]) { c.setAttribute("opacity", 0); return; }
    c.setAttribute("x1", el.__xs[i]); c.setAttribute("x2", el.__xs[i]); c.setAttribute("opacity", .35);
  });
}
const niceTicks = (lo, hi, n = 5) => { const st = (hi - lo) / n; const mag = 10 ** Math.floor(Math.log10(st)); const f = st / mag; const s = (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * mag; const out = []; for (let v = Math.ceil(lo / s) * s; v <= hi + 1e-9; v += s) out.push(+v.toFixed(10)); return out; };
const path = (pts, sx, sy) => pts.map((p, i) => `${i ? "L" : "M"}${sx(p[0]).toFixed(1)},${sy(p[1]).toFixed(1)}`).join("");
const band = (hi, lo, sx, sy) => { const a = hi.map(p => `${sx(p[0]).toFixed(1)},${sy(p[1]).toFixed(1)}`), b = lo.slice().reverse().map(p => `${sx(p[0]).toFixed(1)},${sy(p[1]).toFixed(1)}`); return `M${a.join("L")}L${b.join("L")}Z`; };
const dotSvg = (x, y, c) => `<circle cx="${x}" cy="${y}" r="6" fill="var(--surface)"/><circle cx="${x}" cy="${y}" r="4" fill="${c}"/>`;
const xfmtCalls = v => v >= 1000 ? (v / 1000).toFixed(v % 1000 ? 1 : 0) + "k" : v;

/* ------------------------------------------------------------------ experiment tab */
function loadScenario(key, auto = true) {
  const sc = D.scenarios.find(s => s.meta.key === key) || D.scenarios[0];
  S.key = sc.meta.key; S.rec = sc.record; S.meta = sc.meta; S.replay = sc.replay;
  S.tamper = null; S.verify = null; S.showDiff = false;
  stop(); S.k = auto ? 1 : S.rec.looks.length;
  renderExperiment();
  if (auto) play();
}
function stop() { S.playing = false; clearInterval(S.timer); S.timer = null; }
function play() {
  const L = S.rec.looks.length;
  if (S.k >= L) S.k = 1;
  S.playing = true; clearInterval(S.timer);
  S.timer = setInterval(() => { if (S.k >= L) { stop(); updatePlayer(); return; } S.k++; renderDynamic(); }, Math.max(18, 520 / S.speed));
  updatePlayer();
}
function updatePlayer() {
  const b = $("#pp"); if (!b || !S.rec) return;
  b.innerHTML = S.playing ? icon("pause") : icon("play");
  const sc = $("#scrub"); if (sc) sc.value = S.k;
  const lk = $("#lk"); if (lk) lk.textContent = `look ${S.k}/${S.rec.looks.length}`;
  $$("#spd button").forEach(x => x.setAttribute("aria-pressed", +x.dataset.v === S.speed));
}

function renderExperiment() {

function wireStatic() {
  const L = S.rec.looks.length;
  $("#bk").onclick = () => { stop(); S.k = Math.max(1, S.k - 1); renderDynamic(); };
  $("#fw").onclick = () => { stop(); S.k = L; renderDynamic(); };
  $("#pp").onclick = () => { S.playing ? stop() : play(); updatePlayer(); };
  $("#scrub").oninput = e => { stop(); S.k = +e.target.value; renderDynamic(); };
  $$("#spd button").forEach(b => b.onclick = () => { S.speed = +b.dataset.v; if (S.playing) play(); updatePlayer(); });
  $("#lv").onclick = () => { S.verify = true; renderLedger(); };
  $("#lt").onclick = () => { const vis = visibleLedger(), cand = vis.filter(x => x.body.type === "look"); const pick = cand.length ? cand[Math.floor(cand.length / 2)] : vis[0]; S.tamper = pick.i; S.verify = true; S.ledgerAll = true; renderLedger(); };
  $("#la").onclick = () => { S.ledgerAll = !S.ledgerAll; renderLedger(); };
}

function renderDynamic(first) {
  renderHero(); renderCharts(); renderLedger(); updatePlayer();
}

const seen = () => S.rec.looks.slice(0, S.k);
function truthBetter() { const m = S.meta; return m.true_b > m.true_a && (m.dur_mult_b || 1) <= 1.15 && !m.log_drop_b; }

function naiveWrongText(wins) {
  const a = D.proof && D.proof.scenarios.aa.methods.naive_peek.outcomes, k = wins ? "PROMOTE" : "STOP_HARM", r = a && a[k] ? a[k].rate : 0;
  return r ? `about 1 time in ${Math.round(1 / r)}` : "often";
}

    <div class="var"><div class="row"><span class="dot" style="background:var(--a)"></span><b>A: control</b><span class="chip">${(1 - c.share_b) * 100}% of traffic</span><span class="muted mono" style="margin-left:auto">${v.A.hash.slice(0, 7)}</span></div><div class="muted" style="margin-top:2px">${esc(v.A.name)}</div></div>

function renderCharts() {
  const rows = seen(), rec = S.rec, d = rec.design, c = rec.config, nmax = d.n_max, L = rec.looks.length;
  const xd = [0, nmax], xt = niceTicks(0, nmax, 5), last = rows[rows.length - 1];
  const A = "var(--a)", B = "var(--b)";
  const final = S.k >= L, kind = rec.result.kind;
  // --- evidence
  const eff = rec.looks.map(r => [r.n, r.eff]), harm = rec.looks.map(r => [r.n, -r.harm]);
  const YC = 6;
  const naiveHit = rows.find(r => r.naive_cross && r.z > 0), naiveHurt = rows.find(r => r.naive_cross && r.z < 0);
  const zspec = {
    xd, yd: [-YC, YC], xt, yt: [-6, -4, -2, 0, 2, 4, 6], xf: xfmtCalls, yf: v => v, h: 300, label: "z-statistic against promote and stop boundaries",
    layers: (sx, sy, w) => {
      const eE = eff.map(p => [p[0], Math.min(p[1], YC)]), hE = harm.map(p => [p[0], Math.max(p[1], -YC)]);
      let s = `<path d="${band(eE, eE.map(p => [p[0], YC]), sx, sy)}" fill="var(--good-wash)"/><path d="${band(hE, hE.map(p => [p[0], -YC]), sx, sy)}" fill="var(--bad-wash)"/>`;
      s += `<path d="${path(eE, sx, sy)}" fill="none" stroke="var(--good)" stroke-width="1.6"/><path d="${path(hE, sx, sy)}" fill="none" stroke="var(--bad)" stroke-width="1.6"/>`;
      s += [1.96, -1.96].map(v => `<line x1="${sx(0)}" x2="${sx(nmax)}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--ink-3)" stroke-width="1" opacity=".55"/>`).join("");
      s += `<text x="${sx(nmax) - 4}" y="${sy(1.96) + 13}" text-anchor="end">naive "p&lt;0.05" line (&plusmn;1.96)</text>`;
      s += `<text x="${sx(nmax) - 4}" y="${sy(YC) + 14}" text-anchor="end" class="lbl" style="fill:var(--good-ink)">PROMOTE zone</text><text x="${sx(nmax) - 4}" y="${sy(-YC) - 6}" text-anchor="end" class="lbl" style="fill:var(--bad-ink)">STOP zone</text>`;
      s += `<line x1="${sx(0)}" x2="${sx(nmax)}" y1="${sy(0)}" y2="${sy(0)}" stroke="var(--axis)"/>`;
      s += `<path d="${path(rows.map(r => [r.n, r.z]), sx, sy)}" fill="none" stroke="${B}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
      const fl = naiveHit || naiveHurt;
      if (fl) { const x = sx(fl.n), y = sy(fl.z); s += `<path d="M${x},${y - 11}l7,12h-14z" fill="var(--warn)" stroke="var(--surface)" stroke-width="2"/>`; }
      s += dotSvg(sx(last.n).toFixed(1), sy(last.z).toFixed(1), B);
      return s;
    },
    tip: (r, i) => `<b>Look ${i + 1} &middot; ${nf(r.n)} calls</b><div class="r"><span>z</span><span>${r.z.toFixed(2)}</span></div><div class="r"><span>promote at</span><span>&ge; ${r.eff > 50 ? "&gt;50" : r.eff.toFixed(2)}</span></div><div class="r"><span>stop at</span><span>&le; &minus;${r.harm.toFixed(2)}</span></div><div class="r"><span>naive rule fires</span><span>${r.naive_cross ? "yes" : "no"}</span></div>`
  };
  drawChart($("#c-z"), zspec, rows);
  $("#lg-z").innerHTML = `<span><i style="border-color:var(--b)"></i>z of B vs A</span><span><i style="border-color:var(--good)"></i>promote boundary</span><span><i style="border-color:var(--bad)"></i>stop boundary</span><span><i style="border-color:var(--ink-3)"></i>naive &plusmn;1.96</span><span><svg width="14" height="12"><path d="M7 1l6 10H1z" fill="var(--warn)"/></svg>naive rule would fire here</span>`;
  // typical-tool strip
  const tp = $("#typical"); const fl = naiveHit || naiveHurt;
  if (fl) {
    const wins = fl.z > 0, wrong = wins ? !truthBetter() : S.meta.true_b >= S.meta.true_a;
    tp.innerHTML = `<div class="note ${wrong ? "" : "info"}" style="margin-top:10px"><b>${wrong ? "A typical tool would have gotten this wrong." : "A typical tool would have agreed here."}</b> A plain "p &lt; 0.05 at every check" rule fires at look ${fl.k + 1} (${nf(fl.n)} calls) and ${wins ? "crowns B the winner" : "kills B"}. ${wrong ? `The known truth is that ${wins ? "B is not better" : "B is not worse"}.` : `It happens to be right in this run, but it is wrong ${naiveWrongText(wins)} when nothing changed (see Proof Lab).`}</div>`;
  } else tp.innerHTML = "";

  // --- lift
  const mid = rec.looks.map(r => [r.n, r.diff * 100]);
  const ok = rows.filter(r => Math.abs(r.rci[0]) < 0.4 && Math.abs(r.rci[1]) < 0.4);
  const truth = (S.meta.true_b - S.meta.true_a) * 100;
  const ymax = Math.max(12, Math.ceil(Math.max(Math.abs(truth) + 4, ...ok.map(r => Math.max(Math.abs(r.rci[0]), Math.abs(r.rci[1])) * 100)) / 4) * 4);
  drawChart($("#c-l"), {
    xd, yd: [-ymax, ymax], xt, yt: niceTicks(-ymax, ymax, 4), xf: xfmtCalls, yf: v => (v > 0 ? "+" : "") + v, h: 250, label: "lift with always-valid interval",
    layers: (sx, sy) => {
      const vis = rows.filter(r => r.rci[0] > -400); const hi = vis.map(r => [r.n, r.rci[1] * 100]), lo = vis.map(r => [r.n, r.rci[0] * 100]);
      let s = `<line x1="${sx(0)}" x2="${sx(nmax)}" y1="${sy(0)}" y2="${sy(0)}" stroke="var(--axis)"/>`;
      s += `<line x1="${sx(0)}" x2="${sx(nmax)}" y1="${sy(truth)}" y2="${sy(truth)}" stroke="var(--ink)" stroke-width="1" opacity=".5"/><text x="${sx(nmax) - 4}" y="${sy(truth) - 5}" text-anchor="end">known truth ${truth >= 0 ? "+" : ""}${truth.toFixed(0)} pp</text>`;
      if (vis.length > 1) s += `<path d="${band(hi, lo, sx, sy)}" fill="var(--b)" opacity=".13"/>`;
      s += `<path d="${path(rows.map(r => [r.n, Math.max(-ymax, Math.min(ymax, r.diff * 100))]), sx, sy)}" fill="none" stroke="var(--b)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`;
      s += dotSvg(sx(last.n).toFixed(1), sy(last.diff * 100).toFixed(1), "var(--b)");
      return s;
    },

/* ------------------------------------------------------------------ ledger */
function ledgerEntries() { return S.rec.ledger.map((e, i) => ({ i, e, body: JSON.parse(e.body) })); }
function visibleLedger() {
  const L = S.rec.looks.length, all = ledgerEntries(), out = [];
  for (const x of all) {
    const t = x.body.type;
    if (t === "look") { if (x.body.payload.k < S.k) out.push(x); }
    else if (["experiment_created"].includes(t) || (t === "routing_changed" && x.body.seq <= 1)) out.push(x);
    else if (S.k >= L) out.push(x);
  }
  return out;
}
function entryText(b) {
  const p = b.payload;
  switch (b.type) {
    case "experiment_created": return `Registered <span class="mono">${p.exp_id}</span> &middot; config <span class="mono">${p.config_hash}</span> &middot; A <span class="mono">${p.variant_A.slice(0, 7)}</span> vs B <span class="mono">${p.variant_B.slice(0, 7)}</span> (${esc(p.variant_B_origin)}) &middot; ${p.design.looks} looks, n&le;${nf(p.design.n_max)}`;
    case "routing_changed": return `Routing &rarr; A ${(p.A * 100).toFixed(0)}% / B ${(p.B * 100).toFixed(0)}%: ${esc(p.reason)}`;
    case "look": return `Look ${p.k + 1}: n=${nf(p.n)}, z=${p.z.toFixed(2)} (promote &ge;${p.bound_eff > 50 ? "&gt;50" : p.bound_eff.toFixed(2)}, stop &le;&minus;${p.bound_harm.toFixed(2)})`;
    case "decision": return `<b>${esc((KIND[p.kind] || { pill: p.kind }).pill || p.kind)}</b>: ${esc(p.reason)}`;
    case "promotion": return `Production prompt <span class="mono">${p.production_before.slice(0, 7)}</span> &rarr; <span class="mono">${p.production_after.slice(0, 7)}</span> &middot; approval: ${esc(p.approval)}`;
    default: return esc(JSON.stringify(p));
  }
}
function chain(entries, tamperIdx) {
  let prev = "0".repeat(64);
  for (const x of entries) {
    let body = x.e.body;
    if (tamperIdx === x.i) body = body.replace(/("z":)(-?[0-9.]+)/, (m, a, b) => a + (parseFloat(b) + 1.7)).replace(/("reason":")/, "$1[edited] ");
    if (x.e.prev !== prev || sha256(prev + body) !== x.e.hash) return { ok: false, bad: x.i };
    prev = x.e.hash;
  }
  return { ok: true, n: entries.length, head: prev };
}
function renderLedger() {
  const vis = visibleLedger(), rows = (S.ledgerAll ? vis : vis.filter(x => x.body.type !== "look"));
  const v = S.verify ? chain(vis, S.tamper) : null;
  $("#la").textContent = S.ledgerAll ? "Key events only" : `Show all ${vis.length} entries`;
  $("#vf").style.color = v ? (v.ok ? "var(--good-ink)" : "var(--bad-ink)") : "";
  $("#vf").innerHTML = v ? (v.ok ? `${icon("check", 14)} Chain intact: ${v.n} entries, head ${v.head.slice(0, 12)}` : `${icon("x", 14)} Chain BROKEN at entry #${v.bad}: the edit is detected`) : "";
  $("#lg").innerHTML = rows.map(x => { const b = x.body, k = b.type === "decision" ? (b.payload.kind) : null, cls = k && (KIND[k] || {}).cls;
      return `<div class="entry ${v && !v.ok && x.i === v.bad ? "bad" : ""}" role="listitem"><span class="seq">#${b.seq}</span><div><div class="hd"><span class="chip ${cls === "run" ? "" : cls || ""}">${esc(b.type.replace(/_/g, " "))}</span><span class="muted">${esc(b.ts.replace("T", " "))}</span><span class="hash" title="${x.e.hash}">${x.e.hash.slice(0, 10)}</span></div><div style="margin-top:3px">${entryText(b)}</div></div></div>`; }).join("");
  if (S.k >= S.rec.looks.length) $("#lg").scrollTop = $("#lg").scrollHeight;
}
