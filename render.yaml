# Render Blueprint: the live Canary app on Render's free plan. See DEPLOY.md.
services:
  - type: web
    name: canary
    runtime: python
    plan: free
    branch: main
    autoDeploy: true            # a push to the branch the service tracks redeploys it; .github/workflows/deploy-render.yml re-points it for any other branch
    buildCommand: pip install -r requirements.txt
    startCommand: python -m canary serve --hosted --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: CANARY_HOSTED
        value: "1"
      - key: CANARY_PASSWORD     # Render asks for it when you apply the Blueprint; the app refuses to start without one
        sync: false
